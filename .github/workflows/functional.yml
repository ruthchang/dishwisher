name: Functional tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dishwisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dishwisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/dishwisher_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/dishwisher_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run build
      - name: Run API functional tests
        run: |
          npm run start > /tmp/dishwisher.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/data > /dev/null; then break; fi
            sleep 2
          done
          node --test tests/functional.mjs || { cat /tmp/dishwisher.log; exit 1; }
